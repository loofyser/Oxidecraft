name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the workspace in release mode
        run: cargo build --workspace --release

  msrv:
    name: msrv 1.85.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Check against the declared minimum
        run: cargo +1.85.0 check --workspace --all-targets

  portability:
    name: portability x86_64-pc-windows-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # zlib-ng and ring build C, so this target needs a mingw-w64 C toolchain.
      - name: Install the mingw-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
      - name: Check the workspace for the cross target
        run: cargo check --workspace --target x86_64-pc-windows-gnu
    # aarch64-apple-darwin is not checked: its C dependencies need the macOS
    # SDK, which no Linux runner provides. It is covered once a macOS job exists.

  graph:
    name: crate graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Crate graph check
        run: bash scripts/check-graph.sh

  assets:
    name: asset guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Asset guard
        run: bash scripts/check-assets.sh

  licences:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check
