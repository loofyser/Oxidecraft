[licenses]
# The workspace crates are GPL-3.0-only and are not published; the allow-list
# below governs third-party dependencies only.
private = { ignore = true }
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "Unicode-3.0", "CC0-1.0", "MPL-2.0",
  # CDLA-Permissive-2.0: webpki-roots' CA certificate data, transitive through
  # ureq's TLS stack; a permissive licence, compatible with GPL-3.0.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Dependencies between workspace crates are path-only and carry no version requirement.
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"

[advisories]
ignore = [
  # paste: archived upstream; transitive through wgpu-hal's metal backend, no upgrade path.
  "RUSTSEC-2024-0436",
  # ttf-parser: unmaintained upstream; transitive through winit's Wayland decorations, no upgrade path.
  "RUSTSEC-2026-0192",
]
